buildscript {
    repositories {
        mavenCentral()
    }
}
plugins {
    id 'eclipse'
    id 'net.neoforged.gradle.userdev' version '7.1.20'
}

eclipse {
    project {
        name = "${parent.name}-neoforge-1.21.1"
    }
}

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = JavaLanguageVersion.of(21)
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))

ext.buildNumber = System.getenv().BUILD_NUMBER ?: "Dev"

project.archivesBaseName = "${parent.name}-neoforge-1.21.1"

dependencies {
    compileOnly "us.dynmap:DynmapCoreAPI:${parent.version}"
    implementation project(path: ":core")
    implementation "net.neoforged:neoforge:21.1.219"
}

processResources {
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(
            version: project.version + '-' + project.ext.buildNumber,
            mcversion: "1.21.1"
        )
    }
}

shadowJar {
    dependencies {
        include(dependency(':core'))
        exclude(dependency("us.dynmap:DynmapCoreAPI"))
        exclude("META-INF/maven/**")
        exclude("META-INF/services/**")
        exclude("com/electronwill/**")
    }
    archiveBaseName = "${parent.name}"
    archiveClassifier = "neoforge-1.21.1"
    destinationDirectory = file '../target'
}

shadowJar.doLast {
    task ->
        ant.checksum file: task.archivePath
}

build.dependsOn(shadowJar)
