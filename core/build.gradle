
apply plugin: 'eclipse'

eclipse {
    project {
        name = "${parent.name}-core"
    }
}

project.archivesBaseName = "${parent.name}-core"

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = 1.8 // Need this here so eclipse task generates correctly.

dependencies {
	compileOnly 'com.google.code.gson:gson:2.8.0'
	compileOnly "us.dynmap:DynmapCoreAPI:${parent.version}"
	testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
	testImplementation 'com.google.code.gson:gson:2.8.0'
	testImplementation "us.dynmap:DynmapCoreAPI:${parent.version}"
}

test {
	useJUnitPlatform()
}

jar {
    destinationDirectory = file '../target'
}

